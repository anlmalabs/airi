# This file contains all English localization strings for the Settings page.
# Structure: nested objects matching the i18n key hierarchy.
# NEVER use bare YAML strings with colons — always use explicit key: "value" form.
# For i18n keys that need HTML (like <b>bold</b>), use double-quoted strings.

settings:
  title: Settings
  description: Configure your AI assistant.
  tabs:
    general: General
    providers: Providers
    ui: UI
    system: System
    advanced: Advanced
  general:
    language:
      label: Language
      description: Select the interface language.
    theme:
      label: Theme
      description: Choose the color theme.
      options:
        light: Light
        dark: Dark
        system: System
    startup:
      label: Startup Behavior
      description: What to do when the app starts.
      options:
        dashboard: Dashboard
        chat: New Chat
        last: Last Session
    updates:
      label: Auto Updates
      description: Automatically check for and install updates.
    telemetry:
      label: Telemetry
      description: Send anonymous usage data to improve the app.
  providers:
    title: Model Providers
    description: Manage API providers and models for chat, speech, and vision.
    catalog:
      title: Provider Catalog
      description: Browse and add providers.
      categories:
        chat: Chat
        speech: Speech
        transcription: Transcription
        vision: Vision
        embeddings: Embeddings
        artistry: Artistry
        storage: Storage
      add:
        title: Add Provider
        description: Add a new provider configuration.
        button: Add
      edit:
        title: Edit Provider
        description: Edit provider configuration.
        button: Save
      delete:
        title: Delete Provider
        description: Are you sure you want to delete this provider?
        button: Delete
      common:
        fields:
          field:
            api-key:
              label: API Key
              description: Your API key for this provider.
              placeholder: Enter API key
            base-url:
              label: Base URL
              description: Custom base URL (optional).
              placeholder: https://api.example.com/v1
            model:
              label: Model
              description: Select a model.
              placeholder: Select model
    explained:
      chat: Text generation model providers. e.g. OpenRouter, OpenAI, Ollama.
      speech: Speech (text-to-speech) model providers. e.g. ElevenLabs, Azure Speech.
      transcription: Transcription (speech-to-text) model providers. e.g. Whisper.cpp,
        OpenAI, Azure Speech
    onboarding:
      chat:
        title: New to Chat?
        description: For a quick start, try <b>LanLan Free</b> (Zero-setup, no key
          needed), <b>Kilo</b> (Coding-optimized free gateway), or <b>Google
          Gemini</b> (Free Cloud) or <b>OpenRouter</b> (Unified Cloud). If you
          prefer privacy and have a GPU, use <b>Ollama</b> or <b>LM Studio</b>
          for a local experience.
      speech:
        title: Need a Voice?
        description: Try <b>Deepgram</b> or <b>Azure Speech</b> for high-quality cloud
          voices with free tiers. For a completely local and free solution, use
          the <b>Web Speech API</b> or <b>Kokoro TTS</b>.
      transcription:
        title: Voice-to-Text?
        description: We recommend <b>Deepgram STT</b> for blazing fast cloud
          transcription. For local use, <b>Web Speech API</b> (Browser) or
          <b>Local Whisper</b> are excellent free choices.
      artistry:
        title: Generate Art?
        description: The standard for local AI art is <b>ComfyUI</b>. If you prefer
          cloud-based generation, <b>Replicate</b> offers a wide variety of
          models with pay-as-you-go pricing.
      vision:
        title: See the World?
        description: Use <b>Google Gemini</b> for powerful and free cloud-based vision.
          For local vision, <b>Ollama</b> with VLMs works well.
      storage:
        title: Need Storage?
        description: Configure <b>S3-Compatible Storage</b> (MinIO, AWS S3).
    provider:
      openai:
        title: OpenAI
        description: Official OpenAI API - GPT-4o, GPT-4, GPT-3.5 Turbo
      anthropic:
        title: Anthropic
